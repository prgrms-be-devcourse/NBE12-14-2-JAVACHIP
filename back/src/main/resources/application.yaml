spring:
  application:
    name: budzet

  datasource:
    url: jdbc:mysql://localhost:3306/budzet?serverTimezone=Asia/Seoul
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.budzet: DEBUG

custom:
  jwt:
    access-secret: ${ACCESS_SECRET}
    access-expire-millis: "#{1000L * 60 * 60}"
    refresh-secret: ${REFRESH_SECRET}
    refresh-expire-millis: "#{1000L * 60 * 60 * 24 * 7}"
